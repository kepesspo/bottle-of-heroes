<!doctype html>
<html lang="hu">
<head>
  <meta charset="utf-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1"/>
  <title>Bottle of Heroes — Prototype</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@500;600;700;800;900&family=Space+Grotesk:wght@400;500;600;700&family=Anton&display=swap" rel="stylesheet">
  <style>
    html, body { margin: 0; padding: 0; background: #f0eee9; font-family: 'Nunito', system-ui, sans-serif; -webkit-font-smoothing: antialiased; }
    #root { min-height: 100vh; }
    /* shared screen + element animations */
    @keyframes fadeIn   { from { opacity: 0 } to { opacity: 1 } }
    @keyframes popIn    { from { transform: scale(.7); opacity: 0 } to { transform: scale(1); opacity: 1 } }
    @keyframes slideUp  { from { transform: translateY(60px); opacity: .6 } to { transform: translateY(0); opacity: 1 } }
    @keyframes slideIn  { from { transform: translateX(40px); opacity: 0 } to { transform: translateX(0); opacity: 1 } }
    @keyframes slideBack{ from { transform: translateX(-40px); opacity: 0 } to { transform: translateX(0); opacity: 1 } }
    @keyframes shakeWin { 0%{transform:scale(1)} 30%{transform:scale(1.18) rotate(-3deg)} 60%{transform:scale(1.05) rotate(2deg)} 100%{transform:scale(1)} }
    @keyframes shakeLose{ 0%{transform:translateX(0)} 20%{transform:translateX(-6px)} 40%{transform:translateX(6px)} 60%{transform:translateX(-4px)} 80%{transform:translateX(4px)} 100%{transform:translateX(0)} }
    @keyframes pulse    { 0%,100%{transform:scale(1);opacity:1} 50%{transform:scale(1.08);opacity:.85} }
    @keyframes dotBounce{ 0%,80%,100%{transform:translateY(0);opacity:.4} 40%{transform:translateY(-6px);opacity:1} }
    @keyframes caretBlink{ 0%,50%{opacity:.85} 51%,100%{opacity:0} }
    @keyframes burstPop { from{transform:scale(.5);opacity:0} to{transform:scale(1);opacity:1} }
    @keyframes burstFade{ to{opacity:0;transform:scale(.92) translateY(-8px)} }
    @keyframes wobble   { 0%,100%{transform:rotate(0)} 25%{transform:rotate(-12deg) scale(1.1)} 75%{transform:rotate(10deg) scale(1.1)} }
    @keyframes emojiRise{ 0%{transform:translateY(20px) rotate(0);opacity:0} 15%{opacity:1} 100%{transform:translateY(-560px) rotate(20deg);opacity:0} }
  </style>

  <script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
  <script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
  <script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
</head>
<body>
  <div id="root"></div>

  <script type="text/babel" src="design-canvas.jsx"></script>
  <script type="text/babel" src="ios-frame.jsx"></script>
  <script type="text/babel" src="tweaks-panel.jsx"></script>
  <script type="text/babel" src="bottle-theme.jsx"></script>
  <script type="text/babel" src="bottle-screens.jsx"></script>
  <script type="text/babel" src="bottle-play.jsx"></script>
  <script type="text/babel" src="bottle-app.jsx"></script>

  <script type="text/babel">
    const TWEAK_DEFAULTS = /*EDITMODE-BEGIN*/{
      "radius": 1,
      "tileStyle": 1,
      "dimMode": "fade",
      "buszBadge": "sticker"
    }/*EDITMODE-END*/;

    function Root() {
      const [t, setTweak] = useTweaks(TWEAK_DEFAULTS);
      const radius = t.radius;
      const tileStyle = t.tileStyle;
      const dimMode = t.dimMode;
      const buszBadge = t.buszBadge;
      return (
        <React.Fragment>
          <DesignCanvas>
            <DCSection id="polished" title="Bottle of Heroes" subtitle="Polished — két testvér finomítás">
              <DCArtboard id="A" label="Polished · Mint" width={402} height={874}>
                <IOSDevice width={402} height={874}>
                  <BottleApp variant="A" radius={radius} tileStyle={tileStyle} dimMode={dimMode} buszBadge={buszBadge} />
                </IOSDevice>
              </DCArtboard>
              <DCArtboard id="C" label="Sunset · Sage + Terracotta" width={402} height={874}>
                <IOSDevice width={402} height={874}>
                  <BottleApp variant="C" radius={radius} tileStyle={tileStyle} dimMode={dimMode} buszBadge={buszBadge} />
                </IOSDevice>
              </DCArtboard>
            </DCSection>
          </DesignCanvas>
          <TweaksPanel>
            <TweakSection label="Forma" />
            <TweakSlider label="Sarok-lekerekítettség" value={radius} min={0} max={1.2} step={0.05}
              onChange={(v) => setTweak('radius', v)} />
            <TweakSection label="Játékok rács" />
            <TweakRadio label="Kártya stílus" value={tileStyle}
              options={[
                { value: 1, label: 'Avatar' },
                { value: 2, label: 'Poszter' },
                { value: 3, label: 'Címke' },
              ]}
              onChange={(v) => setTweak('tileStyle', v)} />
            <TweakSelect label="Nem-kiválasztott stílus" value={dimMode}
              options={[
                { value: 'none',   label: 'Semmi (csak keret)' },
                { value: 'fade',   label: 'Halvány (opacity)' },
                { value: 'gray',   label: 'Szürkítve' },
                { value: 'recede', label: 'Hátrahúzott (kicsi)' },
                { value: 'blur',   label: 'Blur (eredeti)' },
              ]}
              onChange={(v) => setTweak('dimMode', v)} />
            <TweakSelect label="DNR Exkluzív jelölés" value={buszBadge}
              options={[
                { value: 'sticker', label: 'Sticker (eredeti, kicsi)' },
                { value: 'corner', label: 'Sarok szalag (jobb felső)' },
                { value: 'ribbon', label: 'Szalag az alján (belül)' },
                { value: 'chip',   label: 'Sárga chip felül középen' },
                { value: 'dot',    label: 'Arany csillag pötty (bal felső)' },
                { value: 'frame',  label: 'Arany keret a kártya köré' },
              ]}
              onChange={(v) => setTweak('buszBadge', v)} />
          </TweaksPanel>
        </React.Fragment>
      );
    }

    // Wait for all scripts to register their globals before mounting.
    const tryMount = () => {
      if (window.BottleApp && window.DesignCanvas && window.IOSDevice && window.TweaksPanel) {
        ReactDOM.createRoot(document.getElementById('root')).render(<Root/>);
      } else {
        setTimeout(tryMount, 30);
      }
    };
    tryMount();
  </script>
</body>
</html>
