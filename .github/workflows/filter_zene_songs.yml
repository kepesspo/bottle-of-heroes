name: Filter Zene Songs (keep only preview-available)

on:
  workflow_dispatch:

jobs:
  filter:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install requests

      - name: Run filter script
        run: python filter_songs_with_preview.py

      - name: Commit and push filtered songs
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add index.html songs_with_preview.json
          git diff --staged --quiet || git commit -m "Auto: filter ZENE_SONGS to preview-only songs"
          git push
